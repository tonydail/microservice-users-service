services:
  users-app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-20-bullseye
    container_name: ${USERS_APP_HOST:-microservice-users-service-app}
    user: node
    volumes:
      - ..:/microservice-users-service:cached
      - users-node-modules:/microservice-users-service/node_modules
      - users-dist:/microservice-users-service/dist
    working_dir: /microservice-users-service
    # For standalone mode: run the service
    # For devcontainer mode: this gets overridden to "sleep infinity"
    command: sh -c "sudo chown -R node:node /microservice-users-service/node_modules /microservice-users-service/dist && npm install && npx prisma generate && npm run db:migrate && npm run db:seed || true && npm run build && /microservice-users-service/register-outbox-connector.sh && npm start"
    env_file:
      - ../../environment/container-hosts.env
      - ../../environment/common-service-db.env
      - ../../environment/microservice-users-service-db.env
      - ../../environment/common-services-app.env
      - ../../environment/microservice-users-service-app.env
    environment:
      - NODE_ENV=development
    # Ports are not exposed to host - only accessible via microservices-net
    # For dev testing, you can temporarily expose them if needed
    depends_on:
      users-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$$USERS_APP_PORT/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
    networks:
      - microservices-net
    restart: unless-stopped

  users-db:
    image: postgres:16-alpine
    container_name: ${USERS_DB_HOST:-microservice-users-service-db}
    restart: unless-stopped
    env_file:
      - ../../environment/container-hosts.env
      - ../../environment/common-service-db.env
      - ../../environment/microservice-users-service-db.env
    # Port not exposed to host - only accessible via microservices-net
    volumes:
      - users-db-data:/var/lib/postgresql/data
    # Enable logical replication for Debezium CDC
    command: postgres -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$USERS_DB_USER -d $$USERS_DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

volumes:
  users-db-data:
    name: microservice_users_service_db_data
  users-node-modules:
    name: microservice_users_service_node_modules
  users-dist:
    name: microservice_users_service_dist

networks:
  microservices-net:
    external: true
    name: microservices-net
