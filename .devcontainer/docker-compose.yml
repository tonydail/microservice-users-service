services:
  users-app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-20-bullseye
    container_name: ${USERS_APP_HOST:-microservice-users-service-app}
    user: node
    working_dir: /microservice-users-service
    restart: unless-stopped

    volumes:
      - ..:/microservice-users-service:cached
      - users-node-modules:/microservice-users-service/node_modules
      - users-dist:/microservice-users-service/dist

    # For standalone mode: run the service
    # For devcontainer mode: this gets overridden to "sleep infinity"
    command: |
      sh -c "chmod +x .devcontainer/scripts/*.sh && .devcontainer/scripts/container-startup.sh standalone"

    env_file:
      - ../../environment/common-db.env
      - ../../environment/users-service-db.env
      - ../../environment/common-app.env
      - ../../environment/users-service.env

    depends_on:
      users-db:
        condition: service_healthy

    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:$$USERS_APP_PORT/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - microservices-net

  users-db:
    image: postgres:16-alpine
    container_name: ${USERS_DB_HOST:-microservice-users-service-db}
    restart: unless-stopped

    # Enable logical replication for Debezium CDC
    command: postgres -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4

    volumes:
      - users-db-data:/var/lib/postgresql/data

    env_file:
      - ../../environment/common-db.env
      - ../../environment/users-service-db.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - microservices-net

volumes:
  users-db-data:
    name: microservice_users_service_db_data
  users-node-modules:
    name: microservice_users_service_node_modules
  users-dist:
    name: microservice_users_service_dist

networks:
  microservices-net:
    external: true
    name: microservices-net
